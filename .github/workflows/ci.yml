name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-frontend:
    name: FE Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-storage/package-lock.json
      - run: cd photo-storage && npm ci
      - run: cd photo-storage && npx vue-tsc --noEmit

  build-frontend:
    name: FE Build
    runs-on: ubuntu-latest
    needs: typecheck-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-storage/package-lock.json
      - run: cd photo-storage && npm ci
      - run: cd photo-storage && npm run build

  typecheck-backend:
    name: BE Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-storage/server/package-lock.json
      - run: cd photo-storage/server && npm ci
      - run: cd photo-storage/server && npx tsc --noEmit

  build-backend:
    name: BE Build
    runs-on: ubuntu-latest
    needs: typecheck-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-storage/server/package-lock.json
      - run: cd photo-storage/server && npm ci
      - run: cd photo-storage/server && npm run build
