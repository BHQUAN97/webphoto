name: Scheduled Tasks

on:
  schedule:
    - cron: '0 19 * * *'   # 2:00 AM UTC+7 — expire images
    - cron: '0 20 * * *'   # 3:00 AM UTC+7 — reconcile quota
    - cron: '0 * * * *'    # Every hour — remind payments
    - cron: '0 20 * * 1'   # 3:00 AM UTC+7 Monday — SSL renewal
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'remind-payments'
        type: choice
        options:
          - all
          - expire-images
          - reconcile-quota
          - remind-payments
          - ssl-renew

jobs:
  expire-images:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'expire-images' || github.event.inputs.task == 'all'))
    runs-on: ubuntu-latest
    steps:
      - name: Run expire-images cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          HTTP=$(curl -s -o /tmp/resp -w '%{http_code}' --max-time 30 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "https://bhquan.site/api/cron/expire-images")
          BODY=$(cat /tmp/resp 2>/dev/null)
          echo "HTTP: $HTTP | Body: $BODY"
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || { echo "::error::expire-images HTTP $HTTP: $BODY"; exit 1; }

  reconcile-quota:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'reconcile-quota' || github.event.inputs.task == 'all'))
    runs-on: ubuntu-latest
    steps:
      - name: Run reconcile-quota cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          HTTP=$(curl -s -o /tmp/resp -w '%{http_code}' --max-time 30 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "https://bhquan.site/api/cron/reconcile-quota")
          BODY=$(cat /tmp/resp 2>/dev/null)
          echo "HTTP: $HTTP | Body: $BODY"
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || { echo "::error::reconcile-quota HTTP $HTTP: $BODY"; exit 1; }

  remind-payments:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'remind-payments' || github.event.inputs.task == 'all'))
    runs-on: ubuntu-latest
    steps:
      - name: Run remind-payments cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          HTTP=$(curl -s -o /tmp/resp -w '%{http_code}' --max-time 30 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "https://bhquan.site/api/cron/remind-payments")
          BODY=$(cat /tmp/resp 2>/dev/null)
          echo "HTTP: $HTTP | Body: $BODY"
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || { echo "::error::remind-payments HTTP $HTTP: $BODY"; exit 1; }

  # ─── SSL Renewal ─────────────────────────────────────
  # certbot container tu renew nhung KHONG reload nginx sau khi renew
  # Job nay: request/renew LE certs + reload nginx
  # Chay hang tuan Mon 3AM UTC+7, hoac manual via workflow_dispatch
  ssl-renew:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'ssl-renew' || github.event.inputs.task == 'all'))
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      - name: Request / renew LE certs + reload nginx
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sshpass -e ssh -p $PORT $VPS "
            export PATH=\$PATH:/usr/local/bin
            DC='docker compose -f /opt/infra/docker-compose.yml'

            echo '=== Renewing Let'\''s Encrypt certs (all domains) ==='
            timeout 180 \$DC run --rm --entrypoint '' certbot \
              certbot renew 2>&1 || echo '::warning::certbot renew failed'

            echo '=== Reloading nginx ==='
            if docker inspect shared-nginx --format '{{.State.Running}}' 2>/dev/null | grep -q true; then
              docker exec shared-nginx nginx -s reload && echo 'Nginx reloaded OK'
            else
              echo '::error::shared-nginx not running'
            fi

            echo '=== Cert status ==='
            \$DC run --rm --entrypoint '' certbot certbot certificates 2>&1 \
              | grep -E 'Certificate Name:|Domains:|Expiry Date:|VALID|INVALID' || true
          "
