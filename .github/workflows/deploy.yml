name: Deploy to VPS

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/backup.yml'
      - '.github/workflows/cron.yml'
      - '.github/workflows/restore.yml'
      - '.github/workflows/vps-setup.yml'
      - '.github/workflows/fix-nginx.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  APP_DIR: /opt/webphoto
  INFRA_DIR: /opt/infra

jobs:
  # ─── STAGE 1: BUILD (on GitHub runner) ──────────────
  build:
    name: "1. Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            photo-storage/package-lock.json
            photo-storage/server/package-lock.json

      - name: Build frontend (Vue SPA)
        run: |
          cd photo-storage
          npm ci
          npm run build

      - name: Build backend API (TypeScript)
        run: |
          cd photo-storage/server
          npm ci
          npm run build

      - name: Package build artifacts
        run: |
          tar czf /tmp/webphoto-build.tar.gz \
            photo-storage/dist \
            photo-storage/server/dist \
            photo-storage/server/package.json \
            photo-storage/server/package-lock.json \
            photo-storage/server/Dockerfile \
            photo-storage/server/Dockerfile.worker \
            infra/ \
            docker-compose.prod.yml \
            config/ \
            db/ 2>/dev/null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webphoto-build
          path: /tmp/webphoto-build.tar.gz
          retention-days: 1

  # ─── STAGE 2: DEPLOY TO VPS ─────────────────────────
  deploy:
    name: "2. Deploy to VPS"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webphoto-build
          path: /tmp/

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      - name: Build .env from config + secrets
        run: |
          grep -v '^\s*#' config/env | grep -v '^\s*$' > /tmp/prod.env
          printf 'MYSQL_ROOT_PASSWORD=%s\n' "${{ secrets.MYSQL_ROOT_PASSWORD }}" >> /tmp/prod.env
          printf 'MYSQL_PASSWORD=%s\n' "${{ secrets.MYSQL_PASSWORD }}" >> /tmp/prod.env
          printf 'JWT_SECRET=%s\n' "${{ secrets.JWT_SECRET }}" >> /tmp/prod.env
          printf 'R2_ENDPOINT=%s\n' "${{ secrets.R2_ENDPOINT }}" >> /tmp/prod.env
          printf 'R2_ACCESS_KEY=%s\n' "${{ secrets.R2_ACCESS_KEY }}" >> /tmp/prod.env
          printf 'R2_SECRET_KEY=%s\n' "${{ secrets.R2_SECRET_KEY }}" >> /tmp/prod.env
          printf 'RESEND_API_KEY=%s\n' "${{ secrets.RESEND_API_KEY }}" >> /tmp/prod.env
          printf 'CRON_SECRET=%s\n' "${{ secrets.CRON_SECRET }}" >> /tmp/prod.env

      - name: Upload files to VPS
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR} ${INFRA_DIR}/nginx/conf.d"
          sshpass -e scp -P $PORT /tmp/webphoto-build.tar.gz $VPS:/tmp/
          sshpass -e scp -P $PORT /tmp/prod.env $VPS:${APP_DIR}/.env
          sshpass -e ssh -p $PORT $VPS "
            chmod 600 ${APP_DIR}/.env
            cd ${APP_DIR}
            tar xzf /tmp/webphoto-build.tar.gz
            rm -f /tmp/webphoto-build.tar.gz
            cp docker-compose.prod.yml docker-compose.yml
          "
          # Upload infra nginx config + WebPhoto's own conf to infra conf.d
          sshpass -e scp -P $PORT infra/nginx/nginx.conf $VPS:${INFRA_DIR}/nginx/nginx.conf
          sshpass -e scp -P $PORT nginx/conf.d/bhquan.site.conf $VPS:${INFRA_DIR}/nginx/conf.d/bhquan.site.conf

      - name: Start shared infra (MySQL + Redis + Nginx + Certbot)
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          printf '%s' "$MYSQL_ROOT_PASSWORD" > /tmp/mysql_root_pass.txt
          sshpass -e scp -P $PORT /tmp/mysql_root_pass.txt $VPS:/tmp/mysql_root_pass.txt
          rm -f /tmp/mysql_root_pass.txt
          sshpass -e ssh -p $PORT $VPS "
            export PATH=\$PATH:/usr/local/bin
            docker network create webphoto_backend 2>/dev/null || true
            docker network create webphoto_frontend 2>/dev/null || true
            # Copy infra compose from extracted tar
            cp ${APP_DIR}/infra/docker-compose.yml ${INFRA_DIR}/docker-compose.yml

            # Ensure webphoto static dir exists (nginx mounts it — empty is fine before WebPhoto deploys)
            mkdir -p /opt/webphoto/photo-storage/dist

            MYSQL_OK=\$(docker ps --filter name=shared-mysql --filter status=running --format '{{.Names}}' | grep -c shared-mysql || echo 0)
            NGINX_OK=\$(docker ps --filter name=shared-nginx --filter status=running --format '{{.Names}}' | grep -c shared-nginx || echo 0)

            if [ \"\$MYSQL_OK\" -gt 0 ] && [ \"\$NGINX_OK\" -gt 0 ]; then
              echo 'Infra already running (MySQL + Nginx) — skip start'
              rm -f /tmp/mysql_root_pass.txt
            else
              echo 'Starting shared infra...'
              docker pull nginx:1.27-alpine 2>&1 | tail -1
              echo '--- Pre-start: placeholder cert for bhquan.site (nginx needs cert to start) ---'
              docker run --rm \
                -v shared_certbot_data:/etc/letsencrypt \
                certbot/certbot sh -c '
                  CERT=/etc/letsencrypt/live/bhquan.site/fullchain.pem
                  if openssl x509 -in \$CERT -noout -checkend 3600 2>/dev/null; then
                    echo Cert already valid for bhquan.site
                  else
                    mkdir -p /etc/letsencrypt/live/bhquan.site
                    openssl req -x509 -nodes -days 90 -newkey rsa:2048 \
                      -keyout /etc/letsencrypt/live/bhquan.site/privkey.pem \
                      -out \$CERT -subj /CN=bhquan.site 2>/dev/null && echo Placeholder OK
                  fi
                ' 2>&1 || echo '::warning::Placeholder cert failed — nginx may not start'
              MYSQL_ROOT_PASSWORD=\$(cat /tmp/mysql_root_pass.txt) docker compose -f ${INFRA_DIR}/docker-compose.yml up -d 2>&1
              rm -f /tmp/mysql_root_pass.txt
              echo 'Waiting for MySQL...'
              for i in \$(seq 1 60); do
                docker exec shared-mysql mysqladmin ping -h localhost --silent 2>/dev/null && { echo 'MySQL ready!'; break; }
                [ \$i -eq 60 ] && { echo '::error::MySQL not ready'; docker logs shared-mysql --tail 20; exit 1; }
                sleep 1
              done
              echo 'Waiting for Nginx...'
              for i in \$(seq 1 20); do
                docker exec shared-nginx nginx -t 2>/dev/null && { echo 'Nginx ready!'; break; }
                [ \$i -eq 20 ] && { echo '::warning::Nginx not ready yet — continuing'; break; }
                sleep 2
              done
            fi
          "

      - name: Create DB + user (photo_storage)
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          printf "CREATE DATABASE IF NOT EXISTS photo_storage CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\nCREATE USER IF NOT EXISTS 'photo_user'@'%%' IDENTIFIED BY '%s';\nGRANT ALL PRIVILEGES ON photo_storage.* TO 'photo_user'@'%%';\nFLUSH PRIVILEGES;\n" "$MYSQL_PASSWORD" > /tmp/create_photo.sql
          sshpass -e scp -P $PORT /tmp/create_photo.sql $VPS:/tmp/create_photo.sql
          rm -f /tmp/create_photo.sql
          sshpass -e ssh -p $PORT $VPS "
            export PATH=\$PATH:/usr/local/bin
            docker cp /tmp/create_photo.sql shared-mysql:/tmp/create_photo.sql
            docker exec shared-mysql bash -c 'MYSQL_PWD=\"\$MYSQL_ROOT_PASSWORD\" mysql -u root < /tmp/create_photo.sql' 2>&1
            docker exec shared-mysql rm -f /tmp/create_photo.sql
            rm -f /tmp/create_photo.sql
          "

      - name: Apply base schema (idempotent)
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          [ ! -d "db/schema/tables" ] && exit 0
          printf '%s' "$MYSQL_PASSWORD" > /tmp/photo_db_pass.txt
          sshpass -e scp -P $PORT /tmp/photo_db_pass.txt $VPS:/tmp/photo_db_pass.txt
          rm -f /tmp/photo_db_pass.txt
          MYSQL_CMD="MYSQL_PWD=\$(cat /tmp/photo_db_pass.txt) docker exec -i shared-mysql mysql -u photo_user photo_storage"
          for f in $(find db/schema/tables -name '*.sql' -type f | sort); do
            echo -n "  $(basename $f) ... "
            if OUT=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD" < "$f" 2>&1); then
              echo "OK"
            else
              echo "WARN: $(echo "$OUT" | head -c 200)"
            fi
          done
          sshpass -e ssh -p $PORT $VPS "rm -f /tmp/photo_db_pass.txt"

      - name: Run DB migrations
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          set +e
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          [ ! -d "db/changelog" ] && exit 0
          printf '%s' "$MYSQL_PASSWORD" > /tmp/photo_db_pass.txt
          sshpass -e scp -P $PORT /tmp/photo_db_pass.txt $VPS:/tmp/photo_db_pass.txt
          rm -f /tmp/photo_db_pass.txt
          MYSQL_CMD="MYSQL_PWD=\$(cat /tmp/photo_db_pass.txt) docker exec -i -e MYSQL_PWD shared-mysql mysql -u photo_user photo_storage"

          for f in $(find db/changelog/_init -name '*.sql' -type f 2>/dev/null | sort); do
            sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD" < "$f" 2>&1 || true
          done

          APPLIED=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD -N -e \"SELECT CONCAT(version, '/', filename) FROM schema_changelog\"" 2>/dev/null || echo "")
          PASS=0; SKIP=0; FAIL=0
          for ver_dir in $(find db/changelog -mindepth 1 -maxdepth 1 -type d ! -name '_init' | sort); do
            VER=$(basename "$ver_dir")
            for f in $(find "$ver_dir" -name '*.sql' -type f | sort); do
              FNAME=$(basename "$f"); KEY="${VER}/${FNAME}"
              echo "$APPLIED" | grep -qF "$KEY" && { ((SKIP++)); continue; }
              echo -n "  $FNAME ... "
              OUTPUT=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD" < "$f" 2>&1)
              if [ $? -eq 0 ]; then
                DESC=$(echo "$FNAME" | sed 's/^[0-9]*__//;s/\.sql$//;s/_/ /g')
                CHECKSUM=$(sha256sum "$f" | cut -d' ' -f1)
                sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD -e \"REPLACE INTO schema_changelog (version,filename,description,applied_by,checksum) VALUES ('$VER','$FNAME','$DESC','ci','$CHECKSUM')\"" 2>/dev/null
                echo "OK"; ((PASS++))
              else
                echo "FAILED"; echo "$OUTPUT" | tail -3 | sed 's/^/    /'; ((FAIL++))
              fi
            done
          done
          sshpass -e ssh -p $PORT $VPS "rm -f /tmp/photo_db_pass.txt"
          echo "Changelog: $PASS applied, $SKIP skipped, $FAIL failed"

      - name: SSL placeholder cert (for nginx to start)
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sshpass -e ssh -p $PORT $VPS "
            DC='docker compose -f ${INFRA_DIR}/docker-compose.yml'
            for DOMAIN in bhquan.site; do
              CERT_VALID=\$(\$DC run --rm --entrypoint '' certbot sh -c \
                'openssl x509 -in /etc/letsencrypt/live/'\$DOMAIN'/fullchain.pem -noout -checkend 3600 2>/dev/null && echo yes || echo no' \
                2>/dev/null || echo no)
              if [ \"\$CERT_VALID\" = 'no' ]; then
                echo 'Creating placeholder cert for '\$DOMAIN'...'
                \$DC run --rm --entrypoint '' certbot sh -c \"
                  mkdir -p /etc/letsencrypt/live/\$DOMAIN && \
                  openssl req -x509 -nodes -days 90 -newkey rsa:2048 \
                    -keyout /etc/letsencrypt/live/\$DOMAIN/privkey.pem \
                    -out /etc/letsencrypt/live/\$DOMAIN/fullchain.pem \
                    -subj '/CN=\$DOMAIN' && echo 'Placeholder OK'
                \" || echo '::error::Failed to create placeholder cert for '\$DOMAIN
              else
                echo 'Cert still valid for '\$DOMAIN
              fi
            done
          "

      - name: Build & Start WebPhoto services
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          echo "=== Building images on VPS ==="
          if ! sshpass -e ssh -p $PORT $VPS "cd ${APP_DIR} && docker compose -f docker-compose.yml build api worker 2>&1"; then
            echo "::error::Docker build failed"
            sshpass -e ssh -p $PORT $VPS "docker logs photo-api --tail 20 2>&1 || true"
            exit 1
          fi
          echo "=== Starting services ==="
          if ! sshpass -e ssh -p $PORT $VPS "cd ${APP_DIR} && docker compose -f docker-compose.yml up -d 2>&1"; then
            echo "::error::Docker start failed"
            sshpass -e ssh -p $PORT $VPS "
              docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -E 'photo-|shared-' || true
              echo '--- photo-api logs ---'
              docker logs photo-api --tail 30 2>&1 || true
            "
            exit 1
          fi
          echo "=== Connecting nginx to WebPhoto network ==="
          sshpass -e ssh -p $PORT $VPS "
            docker network connect webphoto_frontend shared-nginx 2>/dev/null || true
          "
          echo "=== Check nginx running ==="
          sleep 5
          sshpass -e ssh -p $PORT $VPS "
            STATUS=\$(docker inspect shared-nginx --format '{{.State.Status}}' 2>/dev/null || echo 'missing')
            if [ \"\$STATUS\" != 'running' ]; then
              echo '::error::shared-nginx not running (status='\$STATUS')'
              echo '--- nginx logs ---'
              docker logs shared-nginx --tail 30 2>&1 || true
              echo '--- nginx config test ---'
              docker run --rm \
                -v ${INFRA_DIR}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
                -v ${INFRA_DIR}/nginx/conf.d:/etc/nginx/conf.d:ro \
                -v shared_certbot_data:/etc/letsencrypt:ro \
                nginx:1.27-alpine nginx -t 2>&1 || true
              exit 1
            fi
            echo 'nginx: OK (running)'
            docker exec shared-nginx nginx -s reload 2>/dev/null || true
          "

      - name: Get real SSL cert (Let's Encrypt)
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sleep 8
          sshpass -e ssh -p $PORT $VPS "
            DC='docker compose -f ${INFRA_DIR}/docker-compose.yml'
            for DOMAIN in bhquan.site; do
              IS_REAL=\$(\$DC run --rm --entrypoint '' certbot sh -c '
                CERT=/etc/letsencrypt/live/'\$DOMAIN'/fullchain.pem
                [ ! -f \"\$CERT\" ] && echo no && exit 0
                openssl x509 -in \"\$CERT\" -noout -checkend 2592000 2>/dev/null || { echo no; exit 0; }
                openssl x509 -in \"\$CERT\" -noout -issuer 2>/dev/null | grep -qiE \"let.s encrypt|R3|R10|R11|E5|E6\" && echo yes || echo no
              ' 2>/dev/null || echo no)
              if [ \"\$IS_REAL\" = 'yes' ]; then
                echo 'LE cert valid (>30d) for '\$DOMAIN' — skip'
                continue
              fi
              echo 'Requesting LE cert for '\$DOMAIN'...'
              \$DC run --rm --entrypoint '' certbot sh -c \"
                rm -rf /etc/letsencrypt/live/\$DOMAIN  /etc/letsencrypt/live/\$DOMAIN-*
                rm -rf /etc/letsencrypt/archive/\$DOMAIN /etc/letsencrypt/archive/\$DOMAIN-*
                rm -f  /etc/letsencrypt/renewal/\$DOMAIN.conf /etc/letsencrypt/renewal/\$DOMAIN-*.conf
              \"
              if timeout 120 \$DC run --rm --entrypoint '' certbot \
                certbot certonly --webroot -w /var/www/certbot \
                --non-interactive --cert-name \$DOMAIN \
                --email admin@bhquan.site --agree-tos --no-eff-email \
                -d \$DOMAIN -d www.\$DOMAIN 2>&1; then
                echo 'LE cert OK for '\$DOMAIN' (with www.)'
              elif timeout 120 \$DC run --rm --entrypoint '' certbot \
                certbot certonly --webroot -w /var/www/certbot \
                --non-interactive --cert-name \$DOMAIN \
                --email admin@bhquan.site --agree-tos --no-eff-email \
                -d \$DOMAIN 2>&1; then
                echo 'LE cert OK for '\$DOMAIN' (without www.)'
              else
                echo '::warning::LE failed for '\$DOMAIN' — recreating placeholder'
                \$DC run --rm --entrypoint '' certbot sh -c \"
                  mkdir -p /etc/letsencrypt/live/\$DOMAIN
                  openssl req -x509 -nodes -days 90 -newkey rsa:2048 \
                    -keyout /etc/letsencrypt/live/\$DOMAIN/privkey.pem \
                    -out /etc/letsencrypt/live/\$DOMAIN/fullchain.pem \
                    -subj '/CN=\$DOMAIN' 2>/dev/null
                \" || true
              fi
            done
            sleep 3
            if docker inspect shared-nginx --format '{{.State.Running}}' 2>/dev/null | grep -q true; then
              docker exec shared-nginx nginx -s reload 2>/dev/null && echo 'Nginx reloaded with latest certs' || echo '::warning::nginx reload skipped'
            fi
          " || true

      - name: Install crontab (idempotent)
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}/scripts"
          sshpass -e scp -P $PORT scripts/crontab.example $VPS:${APP_DIR}/scripts/crontab.example
          sshpass -e ssh -p $PORT $VPS "
            if [ ! -f /etc/cron.d/webphoto ]; then
              if cp ${APP_DIR}/scripts/crontab.example /etc/cron.d/webphoto 2>/dev/null; then
                chmod 644 /etc/cron.d/webphoto
                chown root:root /etc/cron.d/webphoto 2>/dev/null || true
                echo 'Crontab installed: /etc/cron.d/webphoto'
                ls -la /etc/cron.d/webphoto
              else
                echo '::warning::Cannot write /etc/cron.d/webphoto — manual install needed:'
                echo '  sudo cp ${APP_DIR}/scripts/crontab.example /etc/cron.d/webphoto && sudo chmod 644 /etc/cron.d/webphoto'
              fi
            else
              echo 'Crontab already exists — skip (/etc/cron.d/webphoto)'
              ls -la /etc/cron.d/webphoto
            fi
          "

  # ─── STAGE 3: VERIFY ─────────────────────────────────
  verify:
    name: "3. Health Check"
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      - name: Wait + API health check
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sleep 15
          for i in $(seq 1 20); do
            if RESULT=$(sshpass -e ssh -p $PORT $VPS "docker exec photo-api wget -qO- http://localhost:4000/api/health 2>/dev/null" 2>/dev/null) && [ -n "$RESULT" ]; then
              echo "API: OK — $RESULT"
              exit 0
            fi
            echo "  Attempt $i/20..."
            if [ $i -eq 20 ]; then
              echo "::error::API health check failed after 75s"
              sshpass -e ssh -p $PORT $VPS "
                docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -E 'photo-|shared-' || true
                echo '--- photo-api logs ---'
                docker logs photo-api --tail 40 2>&1 || true
                echo '--- shared-nginx logs ---'
                docker logs shared-nginx --tail 30 2>&1 || true
                echo '--- nginx config test ---'
                docker exec shared-nginx nginx -t 2>&1 || true
              "
              exit 1
            fi
            sleep 4
          done

      - name: Deploy summary
        if: always()
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          echo "=========================================="
          echo "  WebPhoto — bhquan.site"
          echo "=========================================="
          sshpass -e ssh -p $PORT $VPS "
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'photo-|shared-' 2>/dev/null || true
            echo ''
            echo '--- SSL cert status ---'
            DC='docker compose -f ${INFRA_DIR}/docker-compose.yml'
            for DOMAIN in bhquan.site; do
              INFO=\$(\$DC run --rm --entrypoint '' certbot sh -c '
                CERT=/etc/letsencrypt/live/'\$DOMAIN'/fullchain.pem
                [ ! -f \"\$CERT\" ] && echo MISSING && exit 0
                ISSUER=\$(openssl x509 -in \"\$CERT\" -noout -issuer 2>/dev/null)
                EXPIRY=\$(openssl x509 -in \"\$CERT\" -noout -enddate 2>/dev/null | cut -d= -f2)
                echo \$ISSUER | grep -qiE \"let.s encrypt|R3|R10|R11|E5|E6\" && TYPE=LE || TYPE=PLACEHOLDER
                echo \$TYPE — \$EXPIRY
              ' 2>/dev/null || echo ERROR)
              echo \"  \$DOMAIN: \$INFO\"
            done
          " 2>/dev/null || true
