name: Deploy to VPS

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: photo-storage/package-lock.json

      - name: Install & Build Backend
        run: |
          cd photo-storage/server
          npm install
          npm run build

      - name: Install & Build Frontend
        run: |
          cd photo-storage
          npm install
          npm run build

      - name: Prepare Deployment Files
        run: |
          mkdir -p deploy_tmp/photo-storage/server
          # Copy Frontend build
          cp -r photo-storage/dist deploy_tmp/photo-storage/
          # Copy Backend build & config
          cp -r photo-storage/server/dist deploy_tmp/photo-storage/server/
          cp photo-storage/server/package*.json deploy_tmp/photo-storage/server/
          cp photo-storage/server/Dockerfile deploy_tmp/photo-storage/server/
          # Copy Docker Compose Prod & Env
          cp docker-compose.prod.yml deploy_tmp/docker-compose.yml
          echo "${{ secrets.ENV_FILE }}" > deploy_tmp/.env

      - name: Copy files to VPS (via Password)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "deploy_tmp/*"
          target: "/opt/webphoto"
          strip_components: 1

      - name: Execute Remote Commands (via Password)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd /opt/webphoto
            # Chạy docker-compose với file prod
            docker compose -f docker-compose.yml up -d --build
            # Dọn dẹp các image thừa để tránh đầy ổ cứng VPS
            docker image prune -f
