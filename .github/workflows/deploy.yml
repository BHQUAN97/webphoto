name: Auto Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cron.yml'
      - '.github/workflows/backup.yml'
      - '.github/workflows/restore.yml'
      - '.github/workflows/vps-setup.yml'

# Cancel in-progress deploy khi co push moi
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  APP_DIR: /opt/webphoto

jobs:
  # CI phai pass truoc khi deploy
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-storage/package-lock.json
      - run: cd photo-storage && npm ci && npx vue-tsc --noEmit
      - run: cd photo-storage/server && npm ci && npx tsc --noEmit

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Load config/env
        run: |
          grep -v '^#' config/env | grep -v '^$' | grep '=' >> $GITHUB_ENV
          PASS=$(grep '^VPS_PASSWORD=' config/env | cut -d= -f2-)
          echo "SSHPASS=${PASS}" >> $GITHUB_ENV
          echo "Config loaded"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-storage/package-lock.json

      - name: Build Frontend
        run: |
          cd photo-storage
          npm ci
          npm run build

      - name: Build Backend
        run: |
          cd photo-storage/server
          npm ci
          npm run build

      - name: Setup SSH with sshpass
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.VPS_PORT }} -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # Kiem tra VPS da co /opt/webphoto chua de phan biet first-time vs update
      - name: Detect deploy mode
        id: detect
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"
          if sshpass -e ssh -p $PORT $VPS "test -f ${APP_DIR}/docker-compose.prod.yml"; then
            echo "mode=update" >> $GITHUB_OUTPUT
            echo "Deploy mode: UPDATE (existing installation found)"
          else
            echo "mode=init" >> $GITHUB_OUTPUT
            echo "Deploy mode: INIT (first-time deployment)"
          fi

      # ══════════════════════════════════════════
      # FIRST-TIME DEPLOYMENT
      # ══════════════════════════════════════════
      - name: '[INIT] Upload full project to VPS'
        if: steps.detect.outputs.mode == 'init'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          # Tao thu muc tren VPS
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}"

          # Upload docker-compose, Dockerfiles, nginx, scripts
          sshpass -e scp -P $PORT docker-compose.prod.yml $VPS:${APP_DIR}/
          sshpass -e scp -P $PORT docker-compose.tunnel.yml $VPS:${APP_DIR}/ 2>/dev/null || true
          sshpass -e scp -P $PORT .env.example $VPS:${APP_DIR}/

          # Nginx config
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}/nginx/conf.d"
          sshpass -e scp -P $PORT nginx/nginx.conf $VPS:${APP_DIR}/nginx/
          sshpass -e scp -P $PORT nginx/conf.d/bhquan.site.init.conf.disabled $VPS:${APP_DIR}/nginx/conf.d/bhquan.site.conf
          # Chi upload bhquan.store.conf neu VietNet da deploy (tranh nginx fail khi upstream chua co)
          if sshpass -e ssh -p $PORT $VPS "test -f /opt/vietnet/docker-compose.prod.yml"; then
            sshpass -e scp -P $PORT nginx/conf.d/bhquan.store.conf $VPS:${APP_DIR}/nginx/conf.d/ 2>/dev/null || true
          else
            echo "VietNet not deployed yet — skipping bhquan.store.conf"
          fi

          # Frontend dist
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}/photo-storage"
          sshpass -e scp -P $PORT -r photo-storage/dist $VPS:${APP_DIR}/photo-storage/

          # Backend dist + Dockerfiles + package files
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}/photo-storage/server"
          sshpass -e scp -P $PORT -r photo-storage/server/dist $VPS:${APP_DIR}/photo-storage/server/
          sshpass -e scp -P $PORT photo-storage/server/package.json $VPS:${APP_DIR}/photo-storage/server/
          sshpass -e scp -P $PORT photo-storage/server/package-lock.json $VPS:${APP_DIR}/photo-storage/server/
          sshpass -e scp -P $PORT photo-storage/server/Dockerfile $VPS:${APP_DIR}/photo-storage/server/
          sshpass -e scp -P $PORT photo-storage/server/Dockerfile.worker $VPS:${APP_DIR}/photo-storage/server/

          # Scripts
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}/scripts"
          sshpass -e scp -P $PORT scripts/deploy.sh $VPS:${APP_DIR}/scripts/ 2>/dev/null || true

          # DB changelog
          if [ -d "db/changelog" ]; then
            sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}/db/changelog"
            sshpass -e scp -P $PORT db/changelog/*.sql $VPS:${APP_DIR}/db/changelog/ 2>/dev/null || true
          fi

      - name: '[INIT] Upload config/env as .env'
        if: steps.detect.outputs.mode == 'init'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}/config"
          sshpass -e scp -P $PORT config/env $VPS:${APP_DIR}/config/env
          sshpass -e ssh -p $PORT $VPS "cp ${APP_DIR}/config/env ${APP_DIR}/.env && chmod 600 ${APP_DIR}/.env"
          echo ".env created from config/env"

      - name: '[INIT] Start shared infrastructure (MySQL + Redis)'
        if: steps.detect.outputs.mode == 'init'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"
          INFRA_DIR=/opt/infra

          # Upload infra compose
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${INFRA_DIR}"
          sshpass -e scp -P $PORT infra/docker-compose.yml $VPS:${INFRA_DIR}/docker-compose.yml

          # Tao .env cho infra (chi can MYSQL_ROOT_PASSWORD)
          MYSQL_ROOT_PWD=$(grep '^MYSQL_ROOT_PASSWORD=' config/env | cut -d= -f2-)
          sshpass -e ssh -p $PORT $VPS "echo 'MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PWD}' > ${INFRA_DIR}/.env && chmod 600 ${INFRA_DIR}/.env"

          # Ensure shared network exists, then start infra
          sshpass -e ssh -p $PORT $VPS "
            docker network create webphoto_backend 2>/dev/null || true
            docker network create vietnet_frontend 2>/dev/null || true

            # Xoa container cu (ten cu photo-* hoac orphan)
            docker rm -f photo-mysql photo-redis shared-mysql shared-redis 2>/dev/null || true

            cd ${INFRA_DIR}
            docker compose up -d

            echo 'Waiting for MySQL...'
            for i in \$(seq 1 60); do
              if docker exec shared-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
                echo 'MySQL ready!'
                break
              fi
              if [ \$i -eq 60 ]; then
                echo 'MySQL not ready after 60s'
                docker logs shared-mysql --tail 20
                exit 1
              fi
              sleep 1
            done
          "

      - name: '[INIT] Create WebPhoto DB + user'
        if: steps.detect.outputs.mode == 'init'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          MYSQL_ROOT_PWD=$(grep '^MYSQL_ROOT_PASSWORD=' config/env | cut -d= -f2-)
          MYSQL_PWD=$(grep '^MYSQL_PASSWORD=' config/env | cut -d= -f2-)

          sshpass -e ssh -p $PORT $VPS "docker exec -i shared-mysql mysql -u root -p'${MYSQL_ROOT_PWD}' <<EOSQL
            CREATE DATABASE IF NOT EXISTS photo_storage CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER IF NOT EXISTS 'photo_user'@'%' IDENTIFIED BY '${MYSQL_PWD}';
            GRANT ALL PRIVILEGES ON *.* TO 'photo_user'@'%';
            FLUSH PRIVILEGES;
            SELECT '[OK] photo_storage database + photo_user ready' AS result;
          EOSQL"

      - name: '[INIT] Build & Start all services'
        if: steps.detect.outputs.mode == 'init'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "
            cd ${APP_DIR}

            # Build api + worker images
            docker compose -f docker-compose.prod.yml build api worker 2>&1 | tail -10

            # Start all services
            docker compose -f docker-compose.prod.yml up -d

            echo 'All services started'
          "

      - name: '[INIT] Setup SSL with Certbot'
        if: steps.detect.outputs.mode == 'init'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "
            cd ${APP_DIR}

            echo 'Requesting SSL certificate...'
            docker compose -f docker-compose.prod.yml run --rm certbot certonly \
              --webroot -w /var/www/certbot \
              --email admin@bhquan.site --agree-tos --no-eff-email \
              -d bhquan.site -d api.bhquan.site -d ws.bhquan.site \
              2>&1 | tail -10

            if [ -f /etc/letsencrypt/live/bhquan.site/fullchain.pem ] || \
               docker compose -f docker-compose.prod.yml exec -T nginx test -f /etc/letsencrypt/live/bhquan.site/fullchain.pem 2>/dev/null; then
              echo 'SSL certificate obtained!'
            else
              echo 'WARNING: SSL cert not found yet. May need manual certbot run.'
              echo 'Continuing with HTTP-only config...'
              exit 0
            fi
          "

      - name: '[INIT] Switch to full SSL Nginx config'
        if: steps.detect.outputs.mode == 'init'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          # Upload full SSL nginx config va reload
          sshpass -e scp -P $PORT nginx/conf.d/bhquan.site.conf $VPS:${APP_DIR}/nginx/conf.d/bhquan.site.conf
          sshpass -e ssh -p $PORT $VPS "
            docker exec shared-nginx nginx -t 2>&1 && \
            docker exec shared-nginx nginx -s reload && \
            echo 'Nginx reloaded with SSL config' || \
            echo 'WARNING: Nginx SSL config test failed — keeping init config'
          "

      - name: '[INIT] Push DB schema + Seed'
        if: steps.detect.outputs.mode == 'init'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          # Chay drizzle-kit push + seed tu trong container
          sshpass -e ssh -p $PORT $VPS "
            cd ${APP_DIR}
            MYSQL_PWD=\$(grep '^MYSQL_PASSWORD=' .env | cut -d= -f2-)

            # Push schema qua docker exec (connect den mysql container)
            docker compose -f docker-compose.prod.yml exec -T api node -e \"
              const { execSync } = require('child_process');
              try {
                execSync('npx drizzle-kit push --force', { stdio: 'inherit', cwd: '/app' });
              } catch(e) {
                console.log('drizzle-kit push note:', e.message);
              }
            \" 2>&1 | tail -5 || echo 'Schema push completed (or already up to date)'

            # Seed
            docker compose -f docker-compose.prod.yml exec -T api node dist/database/seed.js 2>&1 | tail -5 || echo 'Seed completed (or already seeded)'
          "

      # ══════════════════════════════════════════
      # UPDATE DEPLOYMENT (existing VPS)
      # ══════════════════════════════════════════
      - name: '[UPDATE] Upload dist to VPS'
        if: steps.detect.outputs.mode == 'update'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          # Clean old dist, upload new
          sshpass -e ssh -p $PORT $VPS "rm -rf ${APP_DIR}/photo-storage/dist ${APP_DIR}/photo-storage/server/dist"
          sshpass -e scp -P $PORT -r photo-storage/dist $VPS:${APP_DIR}/photo-storage/
          sshpass -e scp -P $PORT -r photo-storage/server/dist $VPS:${APP_DIR}/photo-storage/server/
          sshpass -e scp -P $PORT photo-storage/server/package.json $VPS:${APP_DIR}/photo-storage/server/
          sshpass -e scp -P $PORT photo-storage/server/package-lock.json $VPS:${APP_DIR}/photo-storage/server/

          # Sync Dockerfiles (co the da thay doi)
          sshpass -e scp -P $PORT photo-storage/server/Dockerfile $VPS:${APP_DIR}/photo-storage/server/
          sshpass -e scp -P $PORT photo-storage/server/Dockerfile.worker $VPS:${APP_DIR}/photo-storage/server/

          # Sync docker-compose (co the da thay doi)
          sshpass -e scp -P $PORT docker-compose.prod.yml $VPS:${APP_DIR}/

      - name: '[UPDATE] Sync Nginx config'
        if: steps.detect.outputs.mode == 'update'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          sshpass -e scp -P $PORT nginx/conf.d/bhquan.site.conf $VPS:${APP_DIR}/nginx/conf.d/bhquan.site.conf 2>/dev/null && {
            sshpass -e ssh -p $PORT $VPS "docker exec shared-nginx nginx -t 2>&1 | tail -1 && docker exec shared-nginx nginx -s reload"
            echo "Nginx config updated + reloaded"
          } || echo "Nginx config unchanged (skip)"

      - name: '[UPDATE] Sync shared infra'
        if: steps.detect.outputs.mode == 'update'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"
          INFRA_DIR=/opt/infra

          sshpass -e ssh -p $PORT $VPS "mkdir -p ${INFRA_DIR}"
          sshpass -e scp -P $PORT infra/docker-compose.yml $VPS:${INFRA_DIR}/docker-compose.yml
          MYSQL_ROOT_PWD=$(grep '^MYSQL_ROOT_PASSWORD=' config/env | cut -d= -f2-)
          sshpass -e ssh -p $PORT $VPS "echo 'MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PWD}' > ${INFRA_DIR}/.env && chmod 600 ${INFRA_DIR}/.env"
          sshpass -e ssh -p $PORT $VPS "
            docker network create webphoto_backend 2>/dev/null || true
            docker network create vietnet_frontend 2>/dev/null || true

            # Xoa container cu (ten cu photo-* hoac orphan)
            docker rm -f photo-mysql photo-redis 2>/dev/null || true

            cd ${INFRA_DIR} && docker compose up -d
          "

      - name: '[UPDATE] Rebuild & Restart containers'
        if: steps.detect.outputs.mode == 'update'
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "
            cd ${APP_DIR}
            docker compose -f docker-compose.prod.yml build api worker 2>&1 | tail -5
            docker compose -f docker-compose.prod.yml up -d api worker
          "

      # ══════════════════════════════════════════
      # SHARED STEPS (both init and update)
      # ══════════════════════════════════════════
      - name: Sync config/env to .env on VPS
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}/config"
          sshpass -e scp -P $PORT config/env $VPS:${APP_DIR}/config/env
          sshpass -e ssh -p $PORT $VPS "cp ${APP_DIR}/config/env ${APP_DIR}/.env && chmod 600 ${APP_DIR}/.env"
          echo "config/env synced to .env"

      - name: Run DB Changelog (directory-versioned)
        run: |
          set +e
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"

          if [ ! -d "db/changelog" ]; then
            echo "No changelog directory (skip)"
            exit 0
          fi

          # --- Debug: Read password from VPS .env ---
          echo "[1/5] Reading MYSQL_PASSWORD from VPS .env..."
          MYSQL_PWD=$(sshpass -e ssh -p $PORT $VPS "grep '^MYSQL_PASSWORD=' ${APP_DIR}/.env | cut -d= -f2-")
          if [ -z "$MYSQL_PWD" ]; then
            echo "ERROR: MYSQL_PASSWORD is empty! Check ${APP_DIR}/.env on VPS"
            sshpass -e ssh -p $PORT $VPS "ls -la ${APP_DIR}/.env 2>&1; grep -c 'MYSQL_PASSWORD' ${APP_DIR}/.env 2>&1 || echo '.env not found'"
            exit 1
          fi
          echo "  MYSQL_PASSWORD found (${#MYSQL_PWD} chars)"

          MYSQL_CMD="docker exec -i shared-mysql mysql -u photo_user -p${MYSQL_PWD} photo_storage"

          # --- Debug: Test MySQL connection ---
          echo "[2/5] Testing MySQL connection as photo_user..."
          TEST_OUTPUT=$(sshpass -e ssh -p $PORT $VPS "docker exec -i shared-mysql mysql -u photo_user -p${MYSQL_PWD} -e 'SELECT 1 AS connection_ok'" 2>&1)
          TEST_EXIT=$?
          if [ $TEST_EXIT -ne 0 ]; then
            echo "ERROR: Cannot connect to MySQL as photo_user (exit=$TEST_EXIT)"
            echo "$TEST_OUTPUT"
            echo ""
            echo "--- Checking shared-mysql container ---"
            sshpass -e ssh -p $PORT $VPS "docker ps --filter name=shared-mysql --format '{{.Names}} {{.Status}}'"
            echo "--- Checking MySQL users ---"
            MYSQL_ROOT_PWD=$(grep '^MYSQL_ROOT_PASSWORD=' config/env | cut -d= -f2-)
            sshpass -e ssh -p $PORT $VPS "docker exec -i shared-mysql mysql -u root -p'${MYSQL_ROOT_PWD}' -e \"SELECT User, Host FROM mysql.user; SHOW DATABASES;\"" 2>&1 || echo "(root login also failed)"
            exit 1
          fi
          echo "  Connection OK"

          # --- Debug: Test DB access ---
          echo "[3/5] Testing photo_storage database access..."
          DB_OUTPUT=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD -e 'SHOW TABLES'" 2>&1)
          DB_EXIT=$?
          if [ $DB_EXIT -ne 0 ]; then
            echo "ERROR: Cannot access photo_storage database (exit=$DB_EXIT)"
            echo "$DB_OUTPUT"
            exit 1
          fi
          echo "  Tables in photo_storage: $(echo "$DB_OUTPUT" | tail -n +2 | wc -l)"

          # Step 1: Ensure schema_changelog table exists (_init/)
          echo "[4/5] Running _init scripts..."
          for f in $(find db/changelog/_init -name '*.sql' -type f 2>/dev/null | sort); do
            echo "  Running $(basename $f)..."
            INIT_OUT=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD" < "$f" 2>&1)
            INIT_EXIT=$?
            if [ $INIT_EXIT -ne 0 ]; then
              echo "  WARNING: $(basename $f) failed (exit=$INIT_EXIT)"
              echo "$INIT_OUT" | tail -3 | sed 's/^/    /'
            else
              echo "  OK"
            fi
          done

          # Step 2: Get already-applied migrations (version/filename)
          APPLIED=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD -N -e \"SELECT CONCAT(version, '/', filename) FROM schema_changelog\"" 2>/dev/null || echo "")
          echo "Already applied: $(echo "$APPLIED" | tr '\n' ', ' | sed 's/,$//' || echo 'none')"

          # Step 3: Run unapplied migrations per version directory
          echo "[5/5] Running migrations..."
          PASS=0
          SKIP=0
          FAIL=0

          for ver_dir in $(find db/changelog -mindepth 1 -maxdepth 1 -type d ! -name '_init' | sort); do
            VER=$(basename "$ver_dir")
            echo ""
            echo "── Version $VER ──"

            for f in $(find "$ver_dir" -name '*.sql' -type f | sort); do
              FNAME=$(basename "$f")
              KEY="${VER}/${FNAME}"

              # Skip already applied
              if echo "$APPLIED" | grep -qF "$KEY"; then
                echo "  $FNAME ... SKIP (already applied)"
                ((SKIP++))
                continue
              fi

              echo -n "  $FNAME ... "
              START_MS=$(date +%s%N)
              OUTPUT=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD" < "$f" 2>&1)
              EXIT_CODE=$?
              END_MS=$(date +%s%N)
              DURATION_MS=$(( (END_MS - START_MS) / 1000000 ))

              if [ $EXIT_CODE -eq 0 ]; then
                DESC=$(echo "$FNAME" | sed 's/^[0-9]*__//; s/\.sql$//; s/_/ /g')
                CHECKSUM=$(sha256sum "$f" | cut -d' ' -f1)

                sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD -e \"REPLACE INTO schema_changelog (version, filename, description, applied_by, checksum, execution_ms) VALUES ('$VER', '$FNAME', '$DESC', 'ci', '$CHECKSUM', $DURATION_MS)\"" 2>/dev/null
                echo "OK (${DURATION_MS}ms)"
                ((PASS++))
              else
                echo "FAILED (exit=$EXIT_CODE)"
                echo "$OUTPUT" | sed 's/^/    /'
                ((FAIL++))
              fi
            done
          done

          echo ""
          echo "Changelog: $PASS applied, $SKIP skipped, $FAIL failed"
          if [ $FAIL -gt 0 ]; then exit 1; fi

      - name: Health Check
        run: |
          VPS="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          PORT="${{ env.VPS_PORT }}"
          sleep 8
          RESULT=$(sshpass -e ssh -p $PORT $VPS "curl -sf http://localhost:4000/api/health" 2>&1) && {
            echo "API healthy: $RESULT"
            echo "Deploy successful! (mode: ${{ steps.detect.outputs.mode }})"
          } || {
            echo "WARNING: Health check failed"
            echo "Response: $RESULT"
            sshpass -e ssh -p $PORT $VPS "cd ${APP_DIR} && docker compose -f docker-compose.prod.yml logs api --tail 20"
            exit 1
          }
