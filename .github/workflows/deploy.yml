name: Auto Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/cron.yml'

# Cancel in-progress deploy khi co push moi
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # CI phai pass truoc khi deploy
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-storage/package-lock.json
      - run: cd photo-storage && npm ci && npx vue-tsc --noEmit
      - run: cd photo-storage/server && npm ci && npx tsc --noEmit

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: typecheck
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-storage/package-lock.json

      - name: Build Frontend
        run: |
          cd photo-storage
          npm ci
          npm run build

      - name: Build Backend
        run: |
          cd photo-storage/server
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload dist to VPS
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          APP_DIR="/opt/webphoto"

          # Clean old dist, upload new
          ssh $VPS "rm -rf ${APP_DIR}/photo-storage/dist ${APP_DIR}/photo-storage/server/dist"
          scp -r photo-storage/dist $VPS:${APP_DIR}/photo-storage/
          scp -r photo-storage/server/dist $VPS:${APP_DIR}/photo-storage/server/
          scp photo-storage/server/package.json $VPS:${APP_DIR}/photo-storage/server/
          scp photo-storage/server/package-lock.json $VPS:${APP_DIR}/photo-storage/server/

      - name: Rebuild & Restart containers
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          APP_DIR="/opt/webphoto"

          ssh $VPS "
            cd ${APP_DIR}
            docker compose build api worker 2>&1 | tail -5
            docker compose up -d api worker
          "

      - name: Run DB Changelog
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          APP_DIR="/opt/webphoto"

          if [ -d "db/changelog" ] && ls db/changelog/V*.sql 1>/dev/null 2>&1; then
            MYSQL_PWD=$(ssh $VPS "grep '^MYSQL_PASSWORD=' ${APP_DIR}/.env | cut -d= -f2-")
            for f in $(find db/changelog -name 'V*.sql' -type f | sort); do
              FNAME=$(basename "$f")
              echo -n "  $FNAME ... "
              ssh $VPS "docker exec -i photo-mysql mysql -u photo_user -p${MYSQL_PWD} photo_storage" < "$f" 2>&1 && echo "OK" || echo "FAILED"
            done
          else
            echo "No changelog files (skip)"
          fi

      - name: Health Check
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          sleep 5
          ssh $VPS "curl -sf http://localhost:4000/api/health && echo ''"
          echo "Deploy successful!"
