name: Deploy to VPS

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/backup.yml'
      - '.github/workflows/cron.yml'
      - '.github/workflows/restore.yml'
      - '.github/workflows/vps-setup.yml'

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  APP_DIR: /opt/webphoto
  INFRA_DIR: /opt/infra

jobs:
  # ─── STAGE 1: BUILD (on GitHub runner) ──────────────
  build:
    name: "1. Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            photo-storage/package-lock.json
            photo-storage/server/package-lock.json

      - name: Build frontend (Vue SPA)
        run: |
          cd photo-storage
          npm ci
          npm run build

      - name: Build backend API (TypeScript)
        run: |
          cd photo-storage/server
          npm ci
          npm run build

      - name: Package build artifacts
        run: |
          tar czf /tmp/webphoto-build.tar.gz \
            photo-storage/dist \
            photo-storage/server/dist \
            photo-storage/server/package.json \
            photo-storage/server/package-lock.json \
            photo-storage/server/Dockerfile \
            photo-storage/server/Dockerfile.worker \
            nginx/ \
            infra/ \
            docker-compose.prod.yml \
            config/ \
            db/ 2>/dev/null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webphoto-build
          path: /tmp/webphoto-build.tar.gz
          retention-days: 1

  # ─── STAGE 2: DEPLOY TO VPS ─────────────────────────
  deploy:
    name: "2. Deploy to VPS"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webphoto-build
          path: /tmp/

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      - name: Build .env from config + secrets
        run: |
          grep -v '^\s*#' config/env | grep -v '^\s*$' > /tmp/prod.env
          printf 'MYSQL_ROOT_PASSWORD=%s\n' "${{ secrets.MYSQL_ROOT_PASSWORD }}" >> /tmp/prod.env
          printf 'MYSQL_PASSWORD=%s\n' "${{ secrets.MYSQL_PASSWORD }}" >> /tmp/prod.env
          printf 'JWT_SECRET=%s\n' "${{ secrets.JWT_SECRET }}" >> /tmp/prod.env
          printf 'R2_ENDPOINT=%s\n' "${{ secrets.R2_ENDPOINT }}" >> /tmp/prod.env
          printf 'R2_ACCESS_KEY=%s\n' "${{ secrets.R2_ACCESS_KEY }}" >> /tmp/prod.env
          printf 'R2_SECRET_KEY=%s\n' "${{ secrets.R2_SECRET_KEY }}" >> /tmp/prod.env
          printf 'RESEND_API_KEY=%s\n' "${{ secrets.RESEND_API_KEY }}" >> /tmp/prod.env
          printf 'CRON_SECRET=%s\n' "${{ secrets.CRON_SECRET }}" >> /tmp/prod.env

      - name: Upload files to VPS
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR} ${INFRA_DIR}"
          sshpass -e scp -P $PORT /tmp/webphoto-build.tar.gz $VPS:/tmp/
          sshpass -e scp -P $PORT /tmp/prod.env $VPS:${APP_DIR}/.env
          sshpass -e ssh -p $PORT $VPS "
            chmod 600 ${APP_DIR}/.env
            cd ${APP_DIR}
            tar xzf /tmp/webphoto-build.tar.gz
            rm -f /tmp/webphoto-build.tar.gz
            cp docker-compose.prod.yml docker-compose.yml
          "

      - name: Start shared infra (MySQL + Redis)
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          printf '%s' "$MYSQL_ROOT_PASSWORD" > /tmp/mysql_root_pass.txt
          sshpass -e scp -P $PORT /tmp/mysql_root_pass.txt $VPS:/tmp/mysql_root_pass.txt
          rm -f /tmp/mysql_root_pass.txt
          sshpass -e ssh -p $PORT $VPS "
            export PATH=\$PATH:/usr/local/bin
            docker network create webphoto_backend 2>/dev/null || true
            docker network create vietnet_frontend 2>/dev/null || true
            # Copy infra compose from app dir (already uploaded via tar)
            cp ${APP_DIR}/infra/docker-compose.yml ${INFRA_DIR}/ 2>/dev/null || true

            if docker ps --filter name=shared-mysql --filter status=running --format '{{.Names}}' | grep -q shared-mysql; then
              echo 'shared-mysql already running — skip infra start'
              rm -f /tmp/mysql_root_pass.txt
            else
              echo 'Starting shared infra...'
              MYSQL_ROOT_PASSWORD=\$(cat /tmp/mysql_root_pass.txt) docker compose -f ${INFRA_DIR}/docker-compose.yml up -d 2>&1
              rm -f /tmp/mysql_root_pass.txt
              for i in \$(seq 1 60); do
                docker exec shared-mysql mysqladmin ping -h localhost --silent 2>/dev/null && { echo 'MySQL ready!'; break; }
                [ \$i -eq 60 ] && { echo '::error::MySQL not ready'; docker logs shared-mysql --tail 20; exit 1; }
                sleep 1
              done
            fi
          "

      - name: Create DB + user (photo_storage)
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          printf "CREATE DATABASE IF NOT EXISTS photo_storage CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\nCREATE USER IF NOT EXISTS 'photo_user'@'%%' IDENTIFIED BY '%s';\nGRANT ALL PRIVILEGES ON photo_storage.* TO 'photo_user'@'%%';\nFLUSH PRIVILEGES;\n" "$MYSQL_PASSWORD" > /tmp/create_photo.sql
          sshpass -e scp -P $PORT /tmp/create_photo.sql $VPS:/tmp/create_photo.sql
          rm -f /tmp/create_photo.sql
          sshpass -e ssh -p $PORT $VPS "
            export PATH=\$PATH:/usr/local/bin
            docker cp /tmp/create_photo.sql shared-mysql:/tmp/create_photo.sql
            docker exec shared-mysql bash -c 'MYSQL_PWD=\"\$MYSQL_ROOT_PASSWORD\" mysql -u root < /tmp/create_photo.sql' 2>&1
            docker exec shared-mysql rm -f /tmp/create_photo.sql
            rm -f /tmp/create_photo.sql
          "

      - name: Run DB migrations
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          set +e
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          [ ! -d "db/changelog" ] && exit 0
          printf '%s' "$MYSQL_PASSWORD" > /tmp/photo_db_pass.txt
          sshpass -e scp -P $PORT /tmp/photo_db_pass.txt $VPS:/tmp/photo_db_pass.txt
          rm -f /tmp/photo_db_pass.txt
          MYSQL_CMD="MYSQL_PWD=\$(cat /tmp/photo_db_pass.txt) docker exec -i -e MYSQL_PWD shared-mysql mysql -u photo_user photo_storage"

          for f in $(find db/changelog/_init -name '*.sql' -type f 2>/dev/null | sort); do
            sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD" < "$f" 2>&1 || true
          done

          APPLIED=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD -N -e \"SELECT CONCAT(version, '/', filename) FROM schema_changelog\"" 2>/dev/null || echo "")
          PASS=0; SKIP=0; FAIL=0
          for ver_dir in $(find db/changelog -mindepth 1 -maxdepth 1 -type d ! -name '_init' | sort); do
            VER=$(basename "$ver_dir")
            for f in $(find "$ver_dir" -name '*.sql' -type f | sort); do
              FNAME=$(basename "$f"); KEY="${VER}/${FNAME}"
              echo "$APPLIED" | grep -qF "$KEY" && { ((SKIP++)); continue; }
              echo -n "  $FNAME ... "
              OUTPUT=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD" < "$f" 2>&1)
              if [ $? -eq 0 ]; then
                DESC=$(echo "$FNAME" | sed 's/^[0-9]*__//;s/\.sql$//;s/_/ /g')
                CHECKSUM=$(sha256sum "$f" | cut -d' ' -f1)
                sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD -e \"REPLACE INTO schema_changelog (version,filename,description,applied_by,checksum) VALUES ('$VER','$FNAME','$DESC','ci','$CHECKSUM')\"" 2>/dev/null
                echo "OK"; ((PASS++))
              else
                echo "FAILED"; echo "$OUTPUT" | tail -3 | sed 's/^/    /'; ((FAIL++))
              fi
            done
          done
          echo "Changelog: $PASS applied, $SKIP skipped, $FAIL failed"

      - name: SSL placeholder cert (for nginx to start)
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sshpass -e ssh -p $PORT $VPS "
            cd ${APP_DIR}
            DC='docker compose -f docker-compose.yml'
            # Validate cert using openssl — file existence is not enough (may be corrupt/empty)
            for DOMAIN in bhquan.site bhquan.store shop.bhquan.store; do
              CERT_VALID=\$(\$DC run --rm --entrypoint '' certbot sh -c \
                'openssl x509 -in /etc/letsencrypt/live/'\$DOMAIN'/fullchain.pem -noout 2>/dev/null && echo yes || echo no' \
                2>/dev/null || echo no)
              if [ \"\$CERT_VALID\" = 'no' ]; then
                echo 'Creating/fixing placeholder cert for '\$DOMAIN'...'
                \$DC run --rm --entrypoint '' certbot sh -c \"
                  mkdir -p /etc/letsencrypt/live/\$DOMAIN && \
                  openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
                    -keyout /etc/letsencrypt/live/\$DOMAIN/privkey.pem \
                    -out /etc/letsencrypt/live/\$DOMAIN/fullchain.pem \
                    -subj '/CN=\$DOMAIN' && echo 'OK'
                \" || echo '::error::Failed to create placeholder cert for '\$DOMAIN
              else
                echo 'Valid cert already exists for '\$DOMAIN
              fi
            done
          "

      - name: Build & Start WebPhoto services
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          echo "=== Pulling nginx image ==="
          sshpass -e ssh -p $PORT $VPS "docker pull nginx:1.27-alpine 2>&1" || true
          echo "=== Building images on VPS ==="
          if ! sshpass -e ssh -p $PORT $VPS "cd ${APP_DIR} && docker compose -f docker-compose.yml build api worker 2>&1"; then
            echo "::error::Docker build failed"
            sshpass -e ssh -p $PORT $VPS "docker logs photo-api --tail 20 2>&1 || true"
            exit 1
          fi
          echo "=== Starting services ==="
          if ! sshpass -e ssh -p $PORT $VPS "cd ${APP_DIR} && docker compose -f docker-compose.yml up -d 2>&1"; then
            echo "::error::Docker start failed"
            sshpass -e ssh -p $PORT $VPS "
              docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -E 'photo-|shared-' || true
              echo '--- photo-api logs ---'
              docker logs photo-api --tail 30 2>&1 || true
            "
            exit 1
          fi
          echo "=== Check nginx started ==="
          sleep 5
          sshpass -e ssh -p $PORT $VPS "
            STATUS=\$(docker inspect shared-nginx --format '{{.State.Status}}' 2>/dev/null || echo 'missing')
            if [ \"\$STATUS\" != 'running' ]; then
              echo '::error::shared-nginx not running (status='\$STATUS')'
              echo '--- nginx logs ---'
              docker logs shared-nginx --tail 30 2>&1 || true
              echo '--- nginx config test ---'
              docker run --rm \
                -v /opt/webphoto/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
                -v /opt/webphoto/nginx/conf.d:/etc/nginx/conf.d:ro \
                -v webphoto_certbot_data:/etc/letsencrypt:ro \
                nginx:1.27-alpine nginx -t 2>&1 || true
              exit 1
            fi
            echo 'nginx: OK (running)'
          "

      - name: Get real SSL cert (Let's Encrypt)
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sleep 8
          sshpass -e ssh -p $PORT $VPS "
            cd ${APP_DIR}
            DC='docker compose -f docker-compose.yml'
            for DOMAIN in bhquan.site; do
              # Check if already have real cert
              IS_REAL=\$(\$DC run --rm --entrypoint '' certbot sh -c '
                CERT=/etc/letsencrypt/live/'\$DOMAIN'/fullchain.pem
                [ ! -f \"\$CERT\" ] && echo no && exit 0
                openssl x509 -in \"\$CERT\" -noout -issuer 2>/dev/null | grep -qiE \"let.s encrypt|R3|R10|R11|E5|E6\" && echo yes || echo no
              ' 2>/dev/null || echo no)
              if [ \"\$IS_REAL\" = 'yes' ]; then
                echo 'Real cert already exists for '\$DOMAIN' — skip'
                continue
              fi
              echo 'Getting Lets Encrypt cert for '\$DOMAIN'...'
              # Try LE — do NOT remove placeholder first (if LE fails, nginx needs the placeholder to keep running)
              # certbot certonly --keep-until-expiring won't overwrite if cert is not expiring; use --force-renewal to always try
              timeout 120 \$DC run --rm --entrypoint '' certbot \
                certbot certonly --webroot -w /var/www/certbot \
                --non-interactive --cert-name \$DOMAIN \
                --email admin@bhquan.site --agree-tos --no-eff-email \
                --keep-until-expiring \
                -d \$DOMAIN -d www.\$DOMAIN 2>&1 || {
                echo '::warning::Lets Encrypt failed for '\$DOMAIN' — keeping placeholder cert, site still accessible via HTTPS with self-signed cert'
              }
            done
            # Reload nginx — only if it is running (not in restart loop)
            sleep 3
            if docker inspect shared-nginx --format '{{.State.Running}}' 2>/dev/null | grep -q true; then
              docker exec shared-nginx nginx -s reload 2>/dev/null && echo 'Nginx reloaded OK' || echo '::warning::nginx reload skipped'
            else
              echo '::warning::shared-nginx not running — will recover on next restart'
            fi
          " || true

  # ─── STAGE 3: VERIFY ─────────────────────────────────
  verify:
    name: "3. Health Check"
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      - name: Wait + API health check
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sleep 15
          for i in $(seq 1 20); do
            if RESULT=$(sshpass -e ssh -p $PORT $VPS "docker exec photo-api wget -qO- http://localhost:4000/api/health 2>/dev/null" 2>/dev/null) && [ -n "$RESULT" ]; then
              echo "API: OK — $RESULT"
              exit 0
            fi
            echo "  Attempt $i/20..."
            if [ $i -eq 20 ]; then
              echo "::error::API health check failed after 75s"
              sshpass -e ssh -p $PORT $VPS "
                docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -E 'photo-|shared-' || true
                echo '--- photo-api logs ---'
                docker logs photo-api --tail 40 2>&1 || true
                echo '--- shared-nginx logs ---'
                docker logs shared-nginx --tail 30 2>&1 || true
                echo '--- nginx config test ---'
                docker exec shared-nginx nginx -t 2>&1 || true
              "
              exit 1
            fi
            sleep 4
          done

      - name: Deploy summary
        if: always()
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          echo "=========================================="
          echo "  WebPhoto — bhquan.site"
          echo "=========================================="
          sshpass -e ssh -p $PORT $VPS "
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'photo-|shared-' 2>/dev/null || true
          "
