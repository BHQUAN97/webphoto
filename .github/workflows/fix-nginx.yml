name: Fix Nginx (Emergency)

on:
  workflow_dispatch:

env:
  INFRA_DIR: /opt/infra

jobs:
  fix:
    name: "Recreate shared-nginx"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      - name: Fix infra nginx config dir + upload all conf files
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          echo "=== Fix: remove incorrectly created nginx.conf directory ==="
          sshpass -e ssh -p $PORT $VPS "
            mkdir -p ${INFRA_DIR}/nginx/conf.d
            if [ -d ${INFRA_DIR}/nginx/nginx.conf ]; then
              rm -rf ${INFRA_DIR}/nginx/nginx.conf
              echo 'Removed nginx.conf directory'
            else
              echo 'nginx.conf is a file or missing — OK'
            fi
          "

          echo ""
          echo "=== Upload nginx.conf + all conf.d files ==="
          sshpass -e scp -P $PORT infra/nginx/nginx.conf $VPS:${INFRA_DIR}/nginx/nginx.conf
          sshpass -e scp -P $PORT nginx/conf.d/bhquan.site.conf $VPS:${INFRA_DIR}/nginx/conf.d/bhquan.site.conf
          sshpass -e scp -P $PORT nginx/conf.d/lqd.bhquan.store.conf $VPS:${INFRA_DIR}/nginx/conf.d/lqd.bhquan.store.conf
          sshpass -e scp -P $PORT nginx/conf.d/bhquan.store.conf $VPS:${INFRA_DIR}/nginx/conf.d/bhquan.store.conf

          echo ""
          echo "=== Verify conf.d ==="
          sshpass -e ssh -p $PORT $VPS "ls -la ${INFRA_DIR}/nginx/conf.d/"

      - name: Recreate shared-nginx
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          echo "=== Ensure static dir + remove stale container ==="
          sshpass -e ssh -p $PORT $VPS "
            mkdir -p /opt/webphoto/photo-storage/dist
            docker rm -f shared-nginx 2>/dev/null || echo 'Already gone'
          "

          echo ""
          echo "=== Start nginx (webphoto_certbot_data has real LE certs) ==="
          sshpass -e ssh -p $PORT $VPS "
            docker run -d \
              --name shared-nginx \
              --restart always \
              -p 80:80 \
              -p 443:443 \
              -v ${INFRA_DIR}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v ${INFRA_DIR}/nginx/conf.d:/etc/nginx/conf.d:ro \
              -v /opt/webphoto/photo-storage/dist:/usr/share/nginx/html:ro \
              -v webphoto_certbot_data:/etc/letsencrypt:ro \
              -v certbot_webroot:/var/www/certbot:ro \
              --network webphoto_backend \
              nginx:1.27-alpine 2>&1
          "

          sleep 8

          echo ""
          echo "=== nginx status ==="
          sshpass -e ssh -p $PORT $VPS "
            docker inspect shared-nginx --format 'Status: {{.State.Status}} | Running: {{.State.Running}}' 2>&1
            docker logs shared-nginx --tail 15 2>&1 || true
          "

      - name: Connect nginx to all project networks + reload
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "
            docker network connect webphoto_frontend shared-nginx 2>/dev/null || echo 'webphoto_frontend: already connected or missing'
            docker network connect lqd_frontend shared-nginx 2>/dev/null || echo 'lqd_frontend: already connected or missing'
            docker network connect fashionecom_fashionecom-net shared-nginx 2>/dev/null || echo 'fashionecom_fashionecom-net: already connected or missing'
            echo ''
            echo 'Networks nginx is on:'
            docker inspect shared-nginx --format '{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}' 2>&1
          "

          echo ""
          echo "=== nginx config test + reload ==="
          sshpass -e ssh -p $PORT $VPS "
            docker exec shared-nginx nginx -t 2>&1
            docker exec shared-nginx nginx -s reload 2>&1 || true
          "

      - name: Diagnose - resolv.conf + conf.d + error log
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          echo "=== /etc/resolv.conf inside nginx ==="
          sshpass -e ssh -p $PORT $VPS "docker exec shared-nginx cat /etc/resolv.conf 2>&1"

          echo ""
          echo "=== conf.d contents ==="
          sshpass -e ssh -p $PORT $VPS "docker exec shared-nginx ls -la /etc/nginx/conf.d/ 2>&1"

          echo ""
          echo "=== nginx error log tail (2s timeout) ==="
          sshpass -e ssh -o ConnectTimeout=10 -p $PORT $VPS "timeout 3 docker exec shared-nginx tail -20 /var/log/nginx/error.log 2>&1 || echo 'no error log'"

          echo ""
          echo "=== All containers current status ==="
          sshpass -e ssh -p $PORT $VPS "docker ps -a --format 'table {{.Names}}\t{{.Status}}'"

          echo ""
          echo "=== lqd-api direct IP test (bypass DNS) ==="
          sshpass -e ssh -p $PORT $VPS "
            LQD_IP=\$(docker inspect lqd-api --format '{{.NetworkSettings.Networks.lqd_frontend.IPAddress}}' 2>/dev/null)
            echo 'lqd-api IP on lqd_frontend:' \$LQD_IP
            if [ -n \"\$LQD_IP\" ]; then
              timeout 5 docker exec shared-nginx wget -T3 -qO- http://\${LQD_IP}:4000/api/health 2>&1 | head -3 || echo 'direct IP: FAIL'
            fi
          "

      - name: Test all sites
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          sleep 5

          sshpass -e ssh -p $PORT $VPS "
            echo -n 'bhquan.site:           '; curl -sk -o /dev/null -w '%{http_code}\n' https://bhquan.site/
            echo -n 'lqd.bhquan.store:      '; curl -sk -o /dev/null -w '%{http_code}\n' https://lqd.bhquan.store/
            echo -n 'template.bhquan.store: '; curl -sk -o /dev/null -w '%{http_code}\n' https://template.bhquan.store/
            echo -n 'shop.bhquan.store:     '; curl -sk -o /dev/null -w '%{http_code}\n' https://shop.bhquan.store/
          "
