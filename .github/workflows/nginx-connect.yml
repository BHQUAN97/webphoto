name: Nginx Connect Networks + Reload

on:
  workflow_dispatch:

jobs:
  connect:
    name: "Connect nginx to all networks + reload"
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      - name: Ensure all networks exist + connect nginx
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "
            docker network create webphoto_backend 2>/dev/null || true
            docker network create webphoto_frontend 2>/dev/null || true
            docker network create lqd_frontend 2>/dev/null || true
            docker network create webtemplate_frontend 2>/dev/null || true
            docker network create vietnet_frontend 2>/dev/null || true

            docker network connect webphoto_frontend shared-nginx 2>/dev/null || echo 'webphoto_frontend: already connected'
            docker network connect lqd_frontend shared-nginx 2>/dev/null || echo 'lqd_frontend: already connected'
            docker network connect fashionecom_fashionecom-net shared-nginx 2>/dev/null || echo 'fashionecom_fashionecom-net: already connected or missing'
            docker network connect webtemplate_frontend shared-nginx 2>/dev/null || echo 'webtemplate_frontend: already connected'
            docker network connect vietnet_frontend shared-nginx 2>/dev/null || echo 'vietnet_frontend: already connected'

            echo ''
            echo 'Networks nginx is on:'
            docker inspect shared-nginx --format '{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}' 2>&1

            echo ''
            docker exec shared-nginx nginx -t 2>&1
            docker exec shared-nginx nginx -s reload 2>&1
          "

      - name: Test all sites
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          sleep 3

          sshpass -e ssh -p $PORT $VPS "
            echo -n 'photo.bhquan.site:             '; curl -sk -o /dev/null -w '%{http_code}\n' https://photo.bhquan.site/
            echo -n 'lqd.bhquan.store:        '; curl -sk -o /dev/null -w '%{http_code}\n' https://lqd.bhquan.store/
            echo -n 'shop.bhquan.store:       '; curl -sk -o /dev/null -w '%{http_code}\n' https://shop.bhquan.store/
            echo -n 'template.bhquan.store:   '; curl -sk -o /dev/null -w '%{http_code}\n' https://template.bhquan.store/
            echo -n 'bhquan.store:            '; curl -sk -o /dev/null -w '%{http_code}\n' https://bhquan.store/
          "
