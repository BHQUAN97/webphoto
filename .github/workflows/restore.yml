name: Restore Backup

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Backup date (YYYY-MM-DD), empty = latest'
        required: false
        default: ''
      restore_db:
        description: 'Restore database?'
        required: true
        type: boolean
        default: true
      restore_uploads:
        description: 'Restore uploads?'
        required: true
        type: boolean
        default: true
      run_changelog:
        description: 'Run DB changelog after restore? (upgrade to latest schema)'
        required: true
        type: boolean
        default: true

env:
  INFRA_DIR: /opt/infra
  APP_DIR: /opt/webphoto

jobs:
  restore:
    name: "Restore WebPhoto (${{ inputs.date || 'latest' }})"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      # ── Tim backup date ──
      - name: Resolve backup date
        id: resolve
        run: |
          git fetch origin backups
          git checkout origin/backups -- . 2>/dev/null || { echo "Branch 'backups' not found"; exit 1; }

          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE=$(ls -d webphoto/????-??-?? 2>/dev/null | sort -r | head -1 | xargs basename 2>/dev/null || echo "")
          fi

          if [ -z "$DATE" ]; then
            echo "No WebPhoto backup found!"
            exit 1
          fi

          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "Backup date: ${DATE}"

          echo ""
          echo "=== Available files ==="
          if [ -d "webphoto/${DATE}" ]; then
            ls -lh webphoto/${DATE}/
          else
            echo "webphoto/${DATE}/ — NOT FOUND"
            exit 1
          fi

          # Copy backup files
          mkdir -p /tmp/restore
          cp -r webphoto/${DATE} /tmp/restore/webphoto
          git checkout main

      # ── Decrypt backup files (neu co encrypt) ──
      - name: Decrypt backups
        run: |
          ENCRYPT_KEY="${{ secrets.BACKUP_ENCRYPT_KEY }}"
          GPG_COUNT=$(find /tmp/restore -name '*.gpg' -type f 2>/dev/null | wc -l)
          if [ "$GPG_COUNT" -eq 0 ]; then
            echo "No encrypted files — skip"
            exit 0
          fi
          if [ -z "$ENCRYPT_KEY" ]; then
            echo "ERROR: Found .gpg files but BACKUP_ENCRYPT_KEY not set!"
            exit 1
          fi
          for f in $(find /tmp/restore -name '*.gpg' -type f); do
            OUTPUT="${f%.gpg}"
            gpg --batch --yes --passphrase "${ENCRYPT_KEY}" \
              --decrypt --output "$OUTPUT" "$f"
            rm -f "$f"
            echo "Decrypted: $(basename "$OUTPUT")"
          done

      # ── Upload backup len VPS ──
      - name: Upload backup to VPS
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "mkdir -p /tmp/restore/webphoto"
          sshpass -e scp -P $PORT /tmp/restore/webphoto/* $VPS:/tmp/restore/webphoto/
          echo "Uploaded WebPhoto backup files"

      # ── Restore DB ──
      - name: Restore database
        if: inputs.restore_db
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "
            set -e
            DUMP=/tmp/restore/webphoto/photo_storage.sql.gz
            if [ ! -f \$DUMP ]; then
              echo 'No DB dump found — skip'
              exit 0
            fi

            MYSQL_ROOT_PWD=\$(grep '^MYSQL_ROOT_PASSWORD=' ${INFRA_DIR}/.env 2>/dev/null | cut -d= -f2-)
            if [ -z \"\$MYSQL_ROOT_PWD\" ]; then
              MYSQL_ROOT_PWD=\$(grep '^MYSQL_ROOT_PASSWORD=' ${APP_DIR}/.env 2>/dev/null | cut -d= -f2-)
            fi
            MYSQL_PWD=\$(grep '^MYSQL_PASSWORD=' ${APP_DIR}/.env | cut -d= -f2-)
            if [ -z \"\$MYSQL_ROOT_PWD\" ] || [ -z \"\$MYSQL_PWD\" ]; then
              echo 'ERROR: Missing MYSQL_ROOT_PASSWORD or MYSQL_PASSWORD in deploy env files'
              exit 1
            fi

            echo 'Restoring photo_storage database...'

            # Dam bao DB + user ton tai
            docker exec -i shared-mysql mysql -u root -p\${MYSQL_ROOT_PWD} <<EOSQL
              CREATE DATABASE IF NOT EXISTS photo_storage CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE USER IF NOT EXISTS 'photo_user'@'%' IDENTIFIED BY '\${MYSQL_PWD}';
              GRANT ALL PRIVILEGES ON *.* TO 'photo_user'@'%';
              FLUSH PRIVILEGES;
          EOSQL

            # Safety backup truoc khi DROP — phong truong hop restore fail
            PRE_RESTORE=/tmp/pre-restore-\$(date +%Y%m%d_%H%M%S).sql.gz
            echo \"Creating safety backup → \${PRE_RESTORE}\"
            docker exec shared-mysql mysqldump -u root -p\${MYSQL_ROOT_PWD} \
              --single-transaction --quick photo_storage 2>/dev/null | gzip > \${PRE_RESTORE}
            PRE_SIZE=\$(du -h \${PRE_RESTORE} | cut -f1)
            echo \"Safety backup: \${PRE_SIZE}\"

            # Drop + recreate de restore sach
            docker exec -i shared-mysql mysql -u root -p\${MYSQL_ROOT_PWD} -e 'DROP DATABASE photo_storage; CREATE DATABASE photo_storage CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'

            # Import dump — neu fail thi restore lai tu safety backup
            if gunzip -c \$DUMP | docker exec -i shared-mysql mysql -u root -p\${MYSQL_ROOT_PWD} photo_storage; then
              echo 'Database restored!'
              rm -f \${PRE_RESTORE}
            else
              echo 'RESTORE FAILED — rolling back from safety backup...'
              docker exec -i shared-mysql mysql -u root -p\${MYSQL_ROOT_PWD} -e 'DROP DATABASE IF EXISTS photo_storage; CREATE DATABASE photo_storage CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
              gunzip -c \${PRE_RESTORE} | docker exec -i shared-mysql mysql -u root -p\${MYSQL_ROOT_PWD} photo_storage
              echo 'Rollback complete. Original data preserved.'
              exit 1
            fi

            # Verify
            TABLES=\$(docker exec shared-mysql mysql -u root -p\${MYSQL_ROOT_PWD} -N -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=\"photo_storage\"' 2>/dev/null)
            echo \"Tables: \${TABLES}\"
            if [ \"\${TABLES}\" -lt 1 ]; then
              echo 'WARNING: No tables found after restore!'
              exit 1
            fi
          "

      # ── Restore uploads ──
      - name: Restore uploads
        if: inputs.restore_uploads
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "
            ZIP=/tmp/restore/webphoto/uploads.zip
            if [ ! -f \$ZIP ]; then
              echo 'No uploads backup — skip'
              exit 0
            fi

            WP_UPLOADS=\$(docker inspect photo-api --format '{{range .Mounts}}{{if eq .Destination \"/app/uploads\"}}{{.Source}}{{end}}{{end}}' 2>/dev/null || echo '')
            if [ -z \"\$WP_UPLOADS\" ]; then
              echo 'photo-api not running or no uploads mount — skip'
              exit 0
            fi

            echo \"Restoring uploads to \$WP_UPLOADS...\"
            mkdir -p \$WP_UPLOADS
            unzip -qo \$ZIP -d \$WP_UPLOADS
            echo \"Files: \$(find \$WP_UPLOADS -type f | wc -l)\"
            echo 'Uploads restored!'
          "

      # ── DB Changelog ──
      - name: Run DB changelog
        if: inputs.run_changelog && inputs.restore_db
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          if [ ! -d "db/changelog" ]; then
            echo "No changelog directory — skip"
            exit 0
          fi

          MYSQL_PWD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_CMD="docker exec -i shared-mysql mysql -u photo_user -p${MYSQL_PWD} photo_storage"

          # Init tracker table
          for f in $(find db/changelog/_init -name '*.sql' -type f 2>/dev/null | sort); do
            sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD" < "$f" > /dev/null 2>&1
          done

          # Get applied
          APPLIED=$(sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD -N -e \"SELECT CONCAT(version, '/', filename) FROM schema_changelog\"" 2>/dev/null || echo "")

          echo "=== WebPhoto DB Changelog ==="
          PASS=0; SKIP=0; FAIL=0

          for ver_dir in $(find db/changelog -mindepth 1 -maxdepth 1 -type d ! -name '_init' | sort); do
            VER=$(basename "$ver_dir")
            echo "── $VER ──"
            for f in $(find "$ver_dir" -name '*.sql' -type f | sort); do
              FNAME=$(basename "$f")
              KEY="${VER}/${FNAME}"
              if echo "$APPLIED" | grep -qF "$KEY"; then
                echo "  $FNAME ... SKIP"
                ((SKIP++)); continue
              fi
              echo -n "  $FNAME ... "
              if sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD" < "$f" 2>&1; then
                DESC=$(echo "$FNAME" | sed 's/^[0-9]*__//; s/\.sql$//; s/_/ /g')
                CHECKSUM=$(sha256sum "$f" | cut -d' ' -f1)
                sshpass -e ssh -p $PORT $VPS "$MYSQL_CMD -e \"REPLACE INTO schema_changelog (version, filename, description, applied_by, checksum) VALUES ('$VER', '$FNAME', '$DESC', 'restore', '$CHECKSUM')\"" 2>/dev/null
                echo "OK"; ((PASS++))
              else
                echo "FAILED"; ((FAIL++))
              fi
            done
          done
          echo "Result: $PASS applied, $SKIP skipped, $FAIL failed"
          if [ $FAIL -gt 0 ]; then exit 1; fi

      # ── Restart + Health check ──
      - name: Restart services
        if: inputs.restore_db
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          sshpass -e ssh -p $PORT $VPS "
            if [ -f ${APP_DIR}/docker-compose.prod.yml ]; then
              echo 'Restarting WebPhoto...'
              cd ${APP_DIR} && docker compose -f docker-compose.prod.yml restart api worker
              echo 'OK'
            else
              echo 'WebPhoto not deployed — skip'
            fi
          "

      - name: Cleanup
        if: always()
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sshpass -e ssh -p $PORT $VPS "rm -rf /tmp/restore" 2>/dev/null || true

      - name: Health check
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          sleep 5
          sshpass -e ssh -p $PORT $VPS "curl -sf http://localhost:4000/api/health" && echo " WebPhoto: OK" || echo " WebPhoto: DOWN"

      - name: Summary
        run: |
          echo "======================================="
          echo "Restore completed"
          echo "  Project:   WebPhoto"
          echo "  Date:      ${{ steps.resolve.outputs.date }}"
          echo "  DB:        ${{ inputs.restore_db }}"
          echo "  Uploads:   ${{ inputs.restore_uploads }}"
          echo "  Changelog: ${{ inputs.run_changelog }}"
          echo "======================================="
