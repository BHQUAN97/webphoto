# ============================================
# PRODUCTION — docker-compose -f docker-compose.prod.yml up -d
# Domain: bhquan.site
# Nginx + Certbot are managed by /opt/infra/docker-compose.yml (shared infrastructure)
# ============================================

services:

  # ─── API Server ─────────────────────────
  # MySQL + Redis + Nginx nam trong /opt/infra/docker-compose.yml (shared)
  api:
    build:
      context: ./photo-storage/server
      dockerfile: Dockerfile
    image: webphoto-api:local
    container_name: photo-api
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: mysql://photo_user:${MYSQL_PASSWORD:-StrongUserPass2024!}@shared-mysql:3306/photo_storage
      REDIS_URL: redis://shared-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_PRIVATE_BUCKET: webphoto
      R2_PUBLIC_BUCKET: webphoto-public
      R2_LIMIT_GB: 10
      CDN_URL: ${CDN_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: noreply@bhquan.site
      APP_NAME: PhotoStorage
      APP_URL: https://bhquan.site
      APP_ADDRESS: Vietnam
      SUPPORT_PHONE: ${SUPPORT_PHONE:-0123456789}
      SUPPORT_EMAIL: support@bhquan.site
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@bhquan.site}
      CORS_ORIGIN: https://bhquan.site
      SOCKET_PORT: 4001
      CRON_SECRET: ${CRON_SECRET}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    networks:
      - backend
      - frontend

  # ─── Worker (image processing) ──────────
  worker:
    build:
      context: ./photo-storage/server
      dockerfile: Dockerfile.worker
    image: webphoto-worker:local
    container_name: photo-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://photo_user:${MYSQL_PASSWORD:-StrongUserPass2024!}@shared-mysql:3306/photo_storage
      REDIS_URL: redis://shared-redis:6379
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_PRIVATE_BUCKET: webphoto
      R2_PUBLIC_BUCKET: webphoto-public
      R2_LIMIT_GB: 10
      CDN_URL: ${CDN_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: noreply@bhquan.site
      APP_NAME: PhotoStorage
      APP_URL: https://bhquan.site
      SUPPORT_PHONE: ${SUPPORT_PHONE:-0123456789}
      SUPPORT_EMAIL: support@bhquan.site
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@bhquan.site}
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "node dist/workers" || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - backend

networks:
  frontend:
    name: webphoto_frontend
    external: true    # managed by deploy — created before up -d, shared-nginx connects to it
  backend:
    name: webphoto_backend
    external: true
