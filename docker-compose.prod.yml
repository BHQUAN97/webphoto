# ============================================
# PRODUCTION — docker-compose -f docker-compose.prod.yml up -d
# Domain: bhquan.site
# ============================================

services:

  # ─── MySQL 8 ────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: photo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-StrongRootPass2024!}
      MYSQL_DATABASE: photo_storage
      MYSQL_USER: photo_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-StrongUserPass2024!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups/mysql:/backups
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ─── Redis 7 ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: photo-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ─── API Server ─────────────────────────
  api:
    build:
      context: ./photo-storage/server
      dockerfile: Dockerfile
    container_name: photo-api
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: mysql://photo_user:${MYSQL_PASSWORD:-StrongUserPass2024!}@mysql:3306/photo_storage
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_PRIVATE_BUCKET: webphoto
      R2_PUBLIC_BUCKET: webphoto-public
      R2_LIMIT_GB: 10
      CDN_URL: ${CDN_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: noreply@bhquan.site
      APP_NAME: PhotoStorage
      APP_URL: https://bhquan.site
      APP_ADDRESS: Vietnam
      SUPPORT_PHONE: ${SUPPORT_PHONE:-0123456789}
      SUPPORT_EMAIL: support@bhquan.site
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@bhquan.site}
      CORS_ORIGIN: https://bhquan.site
      SOCKET_PORT: 4001
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ─── Worker (image processing) ──────────
  worker:
    build:
      context: ./photo-storage/server
      dockerfile: Dockerfile.worker
    container_name: photo-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://photo_user:${MYSQL_PASSWORD:-StrongUserPass2024!}@mysql:3306/photo_storage
      REDIS_URL: redis://redis:6379
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_PRIVATE_BUCKET: webphoto
      R2_PUBLIC_BUCKET: webphoto-public
      R2_LIMIT_GB: 10
      CDN_URL: ${CDN_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: noreply@bhquan.site
      APP_NAME: PhotoStorage
      APP_URL: https://bhquan.site
      SUPPORT_PHONE: ${SUPPORT_PHONE:-0123456789}
      SUPPORT_EMAIL: support@bhquan.site
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@bhquan.site}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # ─── Nginx Reverse Proxy + SSL ──────────
  # Serve cả WebPhoto (bhquan.site) và VietNet (bhquan.store)
  nginx:
    image: nginx:alpine
    container_name: photo-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./photo-storage/dist:/usr/share/nginx/html:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - frontend
      - webproxy
      - vietnet_frontend

  # ─── Certbot (SSL) ──────────────────────
  certbot:
    image: certbot/certbot
    container_name: photo-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_data:
  redis_data:
  certbot_data:
  certbot_www:

networks:
  frontend:
  backend:
  webproxy:
    external: true
  # VietNet (bhquan.store) chạy cùng VPS — photo-nginx cần join network này
  vietnet_frontend:
    external: true
    name: vietnet_frontend
