# ============================================
# bhquan.site — Main site (Frontend + API)
# ============================================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name bhquan.site api.bhquan.site ws.bhquan.site;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Frontend: bhquan.site ────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name bhquan.site;

    ssl_certificate     /etc/letsencrypt/live/bhquan.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhquan.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static files (Vue SPA)
    root /usr/share/nginx/html;
    index index.html;

    # Assets — cache 1 year (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ZIP upload — allow up to 512MB
    location /api/images/upload-zip {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Proxy /api to backend
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Socket.io proxy
    location /socket.io/ {
        proxy_pass http://api:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}

# ─── API: api.bhquan.site ─────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.bhquan.site;

    ssl_certificate     /etc/letsencrypt/live/bhquan.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhquan.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ─── WebSocket: ws.bhquan.site ────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ws.bhquan.site;

    ssl_certificate     /etc/letsencrypt/live/bhquan.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhquan.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://api:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
