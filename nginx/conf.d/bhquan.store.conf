# ============================================
# bhquan.store — VietNet Interior (Next.js + NestJS)
# Proxy toi VietNet services qua vietnet_frontend network
# Dung resolver + variable de nginx khong crash khi VietNet chua start
# ============================================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name bhquan.store www.bhquan.store;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main: bhquan.store ──────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name bhquan.store www.bhquan.store;

    ssl_certificate     /etc/letsencrypt/live/bhquan.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhquan.store/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Docker DNS resolver — cho phep resolve dynamic, khong crash khi container chua up
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Auth endpoints (strict rate limit, no cache) ──
    location ~ ^/api/(auth|login|register|refresh) {
        set $vietnet_api http://vietnet-api:4000;
        proxy_pass $vietnet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ── Upload endpoints (larger timeout) ──
    location ~ ^/api/.*/upload {
        set $vietnet_api http://vietnet-api:4000;
        proxy_pass $vietnet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 20m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── API endpoints ──
    location /api/ {
        set $vietnet_api http://vietnet-api:4000;
        proxy_pass $vietnet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 20m;
    }

    # ── Socket.io (WebSocket upgrade) ──
    location /socket.io/ {
        set $vietnet_api http://vietnet-api:4000;
        proxy_pass $vietnet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Next.js static assets (cache 1 year) ──
    location /_next/static/ {
        set $vietnet_fe http://vietnet-frontend:3000;
        proxy_pass $vietnet_fe;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend (Next.js SSR) ──
    location / {
        set $vietnet_fe http://vietnet-frontend:3000;
        proxy_pass $vietnet_fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
