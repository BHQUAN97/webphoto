# ── FashionEcom — Production (shop.bhquan.store) ──
# Copy vao /opt/webphoto/nginx/conf.d/ tren VPS
# Dung resolver + set $var de nginx khong crash khi container chua up

server {
    listen 80;
    server_name shop.bhquan.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name shop.bhquan.store;

    ssl_certificate     /etc/letsencrypt/live/shop.bhquan.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.bhquan.store/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Docker DNS resolver — dynamic resolution, nginx khong crash khi container chua up
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # API -> backend
    location /api/ {
        set $fe_api http://fashionecom-api:4000;
        proxy_pass $fe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Storage/uploads -> backend
    location /storage/ {
        set $fe_api http://fashionecom-api:4000;
        proxy_pass $fe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Everything else -> frontend
    location / {
        set $fe_frontend http://fashionecom-frontend:3000;
        proxy_pass $fe_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
